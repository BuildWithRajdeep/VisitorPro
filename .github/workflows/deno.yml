# 1. Navigate to your project directory
cd path/to/your/visitorpro
# (Replace 'path/to/your/visitorpro' with your actual project path)

# 2. Initialize a new Git repository
git init

# 3. Stage your files
git add .

# 4. Commit your files
git commit -m "Initial commit: VisitorPro frontend (HTML, CSS, JS)"

# 5. Connect your local repository to GitHub
# Copy the exact command from GitHub's "…or push an existing repository from the command line" section.
# It will look something like this (replace placeholders):
git remote add origin https://github.com/YOUR_USERNAME/YOUR_REPO_NAME.git

# 6. Push your code to GitHub
git push -u origin main
# (Use 'main' or 'master' depending on your default branch)
